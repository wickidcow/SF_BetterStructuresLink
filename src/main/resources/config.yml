# Rebar is also a live provider. Rebar itself is primarily a framework, so no
# core Rebar item is forced into the default loot pool. Add any registered
# Rebar/Rebar-addon NamespacedKey here when desired, for example:
#
#        - provider: rebar
#          id: youraddon:your_item
#          amount: 1
#          weight: 1.0
#
# Unqualified Rebar IDs default to the rebar: namespace.

# Optional overrides for BetterStructures' existing/native treasure filenames.
# These rules are NOT required. The global chance above applies to all generated
# BetterStructures loot containers by default.
#
# treasure-tables:
#   - match: "treasure_end.yml"
#     chance-percent: 2.0
#   - match: "treasure_barrel_food.yml"
#     chance-percent: 0.25
#   - match: "*underground*"
#     chance-percent: 1.5
treasure-tables: []
