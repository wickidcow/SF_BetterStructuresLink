# SF BetterStructures Link
#
# This plugin owns Slimefun structure loot completely.
# Do NOT add "slimefunItem" keys to BetterStructures treasure YAML files.
# BetterStructures fills its normal loot first, then this plugin gets a rare
# chance to add registered Slimefun items to the same generated container.

loot:
  enabled: true

  # Global chance per BetterStructures-generated loot container.
  # 1.0 = 1%, 0.5 = 0.5%, 5.0 = 5%.
  chance-percent: 1.0

  # How many Slimefun stacks are rolled when the rare chance succeeds.
  rolls: 1

  # Hard safety cap per generated container.
  max-items-per-container: 1

  default-pool: slimefun
  debug: false

  worlds:
    # Empty allow list = all worlds unless explicitly denied.
    allow: []
    deny: []

# BetterStructures-style two-stage weighting:
# 1) choose a tier by tier weight
# 2) choose one item inside that tier by item weight
#
# These values were migrated from the former treasure_slimefun.yml.
pools:
  slimefun:
    common:
      weight: 70.0
      items:
        - slimefunItem: IRON_DUST
          amount: 1-4
          weight: 14.0
        - slimefunItem: GOLD_DUST
          amount: 1-3
          weight: 10.0
        - slimefunItem: COPPER_DUST
          amount: 1-4
          weight: 14.0
        - slimefunItem: TIN_DUST
          amount: 1-4
          weight: 12.0
        - slimefunItem: SILVER_DUST
          amount: 1-3
          weight: 8.0
        - slimefunItem: ALUMINUM_DUST
          amount: 1-3
          weight: 10.0
        - slimefunItem: LEAD_DUST
          amount: 1-3
          weight: 8.0
        - slimefunItem: RAG
          amount: 1-2
          weight: 7.0
        - slimefunItem: BANDAGE
          amount: 1-2
          weight: 5.0

    rare:
      weight: 25.0
      items:
        - slimefunItem: STEEL_INGOT
          amount: 1-3
          weight: 16.0
        - slimefunItem: BRONZE_INGOT
          amount: 1-3
          weight: 14.0
        - slimefunItem: DURALUMIN_INGOT
          amount: 1-2
          weight: 12.0
        - slimefunItem: BILLON_INGOT
          amount: 1-2
          weight: 10.0
        - slimefunItem: DAMASCUS_STEEL_INGOT
          amount: 1-2
          weight: 6.0
        - slimefunItem: SPLINT
          amount: 1-2
          weight: 8.0
        - slimefunItem: VITAMINS
          amount: 1
          weight: 5.0

    epic:
      weight: 5.0
      items:
        - slimefunItem: HARDENED_METAL_INGOT
          amount: 1
          weight: 12.0
        - slimefunItem: REINFORCED_ALLOY_INGOT
          amount: 1
          weight: 5.0
        - slimefunItem: GILDED_IRON
          amount: 1
          weight: 8.0
        - slimefunItem: ANVIL_TALISMAN
          amount: 1
          weight: 5.0
        - slimefunItem: MINER_TALISMAN
          amount: 1
          weight: 4.0
        - slimefunItem: HUNTER_TALISMAN
          amount: 1
          weight: 4.0
        - slimefunItem: TRAVELLER_TALISMAN
          amount: 1
          weight: 4.0

# Optional overrides for BetterStructures' existing/native treasure filenames.
# You do NOT need a treasure_slimefun.yml.
#
# Examples:
# treasure-tables:
#   - match: "treasure_end.yml"
#     chance-percent: 2.0
#   - match: "treasure_barrel_food.yml"
#     chance-percent: 0.25
#   - match: "*underground*"
#     chance-percent: 1.5
treasure-tables: []
