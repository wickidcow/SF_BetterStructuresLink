config-version: 2

# SF BetterStructures Link
#
# BetterStructures keeps ownership of structure generation and its normal loot.
# This plugin independently detects optional item ecosystems and can inject their
# real registered ItemStacks after BetterStructures fills a generated container.
#
# No treasure_slimefun.yml (or Rebar/Pylon equivalent) is required.

providers:
  slimefun:
    enabled: true
  rebar:
    enabled: true
  pylon:
    enabled: true

loot:
  enabled: true

  # Global chance per BetterStructures-generated loot container.
  # 1.0 = 1%, 0.5 = 0.5%, 5.0 = 5%.
  chance-percent: 1.0

  # Number of successful custom stacks to attempt after the rare roll succeeds.
  rolls: 1

  # Hard cap per generated container.
  max-items-per-container: 1

  default-pool: mixed
  debug: false

  worlds:
    # Empty allow list = all worlds unless explicitly denied.
    allow: []
    deny: []

# One shared weighted pool can contain entries from any supported provider.
# If a provider is not installed/enabled, its entries are removed from the
# effective roll automatically and the remaining weights are normalized.
#
# The Slimefun entries below preserve the former treasure_slimefun.yml rarity
# tiers and amounts. Pylon defaults are intentionally limited to useful
# materials/consumables rather than powerful machines or creative/admin items.
pools:
  mixed:
    common:
      weight: 70.0
      items:
        - provider: slimefun
          id: IRON_DUST
          amount: 1-4
          weight: 14.0
        - provider: slimefun
          id: GOLD_DUST
          amount: 1-3
          weight: 10.0
        - provider: slimefun
          id: COPPER_DUST
          amount: 1-4
          weight: 14.0
