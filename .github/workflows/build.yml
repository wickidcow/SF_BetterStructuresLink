name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify immutable release workflow policy
        run: python3 -m unittest discover -s scripts -p 'test_release_policy.py' -v

      - name: Verify complete Java 21 bytecode rejection controls
        run: python3 -m unittest discover -s scripts -p 'test_verify_jar_identity.py' -v

      - name: Build
        run: mvn -B -ntp clean verify

      - name: Check compiled plugin against Paper 26.2
        run: mvn -B -ntp surefire:test -Dpaper.version=26.2.build.125-stable

      - name: Reject bundled server API
        shell: bash
        run: |
          set -euo pipefail
          if jar tf target/SF_BetterStructuresLink-*.jar | grep -Eq '^(org/bukkit|io/papermc/paper)/'; then
            echo "Plugin must not package server API classes"
            exit 1
          fi

      - name: Verify raw development JAR identity and Java 21 classes
        run: python3 scripts/verify_jar_identity.py target/SF_BetterStructuresLink-0.3.1-SNAPSHOT.jar

      - name: Retain SHA-scoped raw JAR as a CI artifact (not a GitHub Release)
        uses: actions/upload-artifact@v7
        with:
          name: SF_BetterStructuresLink-${{ github.sha }}
          path: target/SF_BetterStructuresLink-0.3.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 30
